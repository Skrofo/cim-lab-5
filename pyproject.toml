[project]
name = "cim-lab-5"
version = "0.1.0"
description = "Forward models, null spaces and regularised reconstruction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepinv>=0.4.2,<0.6",
  "gdown>=6.5.1",
  "hydra-core>=1.3.2",
  "matplotlib>=3.9",
  "pillow>=10.4",
  "torch>=2.5",
  "torchvision>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
cim-lab-5 = "cim_lab_5.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cim_lab_5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
